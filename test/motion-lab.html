<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WebCatcher Motion Lab</title>
<style>
  :root { color-scheme: dark; --ease: cubic-bezier(.2,.8,.2,1); }
  body { margin: 0; min-height: 100vh; font-family: Georgia, serif; background: #14161b; color: #f0eee6; overflow: hidden; }
  .stage { position: relative; display: grid; place-items: center; height: 100vh; }
  .card { width: 280px; padding: 28px; border: 1px solid #3a3f49; border-radius: 18px; background: #1d2129; opacity: .72; transform: translateY(10px); transition: transform .5s var(--ease), opacity .5s var(--ease), background-color .5s; }
  .card.active { opacity: 1; transform: translateY(0) scale(1.02); background: #262b35; }
  .orb { position: absolute; width: 78px; height: 78px; top: 18%; left: 18%; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #ffd2a8, #ff5f3d 55%, #8d2818); animation: drift 2.4s ease-in-out infinite alternate; }
  .view-hero { view-transition-name: hero; }
  @keyframes drift { from { transform: translate(0, 0) scale(.9); } to { transform: translate(260px, 90px) scale(1.08); } }
  @keyframes fade-out { to { opacity: 0; } }
  ::view-transition-old(hero) { animation: fade-out .35s var(--ease) both; }
  h1 { font-size: 38px; line-height: .96; letter-spacing: -.04em; margin: 0 0 14px; }
  p { line-height: 1.6; color: #9ba3b0; font-size: 14px; }
  button { padding: 10px 14px; border: 1px solid #46505f; border-radius: 7px; background: #1a1e25; color: #f0eee6; }
  .scroll-note { position: absolute; bottom: 24px; animation-timeline: scroll(); animation-range: entry 0% cover 30%; }
</style>
<link rel="stylesheet" href="motion.css">
</head>
<body>
  <div class="orb"></div>
  <main class="stage">
    <section class="card view-hero" id="card">
      <h1>Motion<br>Field Notes</h1>
      <p class="external-motion">A small page for testing CSS transitions, keyframes, WAAPI and view transitions.</p>
      <button id="animate">Run WAAPI</button>
    </section>
  </main>
  <div class="scroll-note">scroll-linked sample</div>
  <script src="app.js"></script>
  <script>
    setTimeout(() => document.getElementById('card').classList.add('active'), 320);
    document.getElementById('animate').addEventListener('click', () => {
      const card = document.getElementById('card');
      card.animate([
        { transform: 'translateY(0) scale(1.02)', opacity: 1 },
        { transform: 'translateY(-12px) scale(.98)', opacity: .7, offset: .55 },
        { transform: 'translateY(0) scale(1.02)', opacity: 1 }
      ], { duration: 680, easing: 'cubic-bezier(.2,.8,.2,1)', iterations: 1 });
    });
    setTimeout(() => {
      if (document.startViewTransition) {
        document.startViewTransition(() => document.body.classList.toggle('flipped'));
      }
    }, 900);
    let last = performance.now();
    function loop(now) {
      if (now - last > 0) {
        document.querySelector('.orb').style.filter = `hue-rotate(${Math.round(now / 40) % 360}deg)`;
        last = now;
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
